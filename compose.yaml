# Local development in Docker: http://localhost:8080
#
#   docker compose up -d          start everything (the first run builds the PHP image)
#   docker compose exec app php artisan migrate:fresh --seed
#   docker compose exec app php artisan test
#   docker compose down           stop (data stays in volumes)
#
# Herd keeps working side by side: Docker uses its own ports and its own PostgreSQL.
# Details: docs/06-development/docker.md

name: craft-woman

x-app-env: &app-env
  APP_URL: http://localhost:8080
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: craft_woman
  DB_USERNAME: postgres
  DB_PASSWORD: secret
  SANCTUM_STATEFUL_DOMAINS: localhost:8080,127.0.0.1:8080
  SESSION_DOMAIN: "null"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: craft_woman
      # Unicode-aware case folding, so ILIKE works for Cyrillic
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
    ports:
      - "5433:5432"   # 5432 on the host is taken by the Windows PostgreSQL service
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: ./docker/php
    environment: *app-env
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor   # Linux vendor, separate from the one Herd uses
    depends_on:
      db:
        condition: service_healthy
    # Install PHP dependencies on the first start, then run PHP-FPM
    command: sh -c "[ -f vendor/autoload.php ] || composer install --no-interaction; php-fpm"

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  vite:
    image: node:22
    working_dir: /var/www/html
    environment:
      VITE_DOCKER: "1"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules   # Linux binaries (esbuild, rollup), not the Windows ones
    # Install packages only when the volume is empty or package-lock.json changed.
    # (npm install, not npm ci: ci tries to delete node_modules, which is a mount point here)
    command: sh -c "sha1sum -c node_modules/.lock.sha1 >/dev/null 2>&1 || (npm install --no-audit --no-fund && sha1sum package-lock.json > node_modules/.lock.sha1); npm run dev"

volumes:
  pgdata:
  vendor:
  node_modules:
