; Course files go up to 100 MB (CurriculumController), product files to 50 MB
upload_max_filesize = 110M
post_max_size = 120M
memory_limit = 512M
max_execution_time = 120

; The project is mounted from Windows, where every file check is slow.
; Cache resolved paths and compiled code; changes are picked up within a second.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 1

date.timezone = UTC
